# set version
version: "3.8"
# define services
services:
  # set service item-db
  item-db:
    # set image
    image: mongo:3
    # set volumes
    volumes:
    - app-db:/data/db
    # add restart policy
    restart: always
  # set service item-app
  item-app:
    # set image
    image: xpaww/item-app:v1
    # map port to 80
    ports:
      - 80:8080
     # add restart policy
    restart: always
# use volumes
volumes:
  # set volume name
  app-db: